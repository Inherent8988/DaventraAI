<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAVENTRA AI</title>

<style>
:root {
  --bg:#101014;
  --panel:#18181f;
  --panel2:#20202a;
  --accent:#8957ff;
  --text:#f5f3fa;
  --muted:#9995a8;
  --border:#302d3b;
  --danger:#ff6262;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}

button,input,textarea {
  font:inherit;
}

button {
  cursor:pointer;
}

#app {
  min-height:100vh;
  display:flex;
}

#sidebar {
  width:260px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.logo {
  font-size:21px;
  font-weight:800;
  letter-spacing:1px;
  color:white;
  padding:8px 4px 18px;
}

.logo span {
  color:var(--accent);
}

#newChat {
  background:var(--accent);
  color:white;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:bold;
}

#chatList {
  display:flex;
  flex-direction:column;
  gap:7px;
  overflow-y:auto;
}

.chat-item {
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--text);
  text-align:left;
  padding:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-item:hover,
.chat-item.active {
  background:var(--panel2);
}

#main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

#topbar {
  height:65px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

#topStatus {
  color:var(--muted);
  font-size:13px;
}

#loginScreen {
  margin:auto;
  width:min(420px,90%);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px;
  text-align:center;
}

#loginScreen h2 {
  margin-top:0;
}

#googleLogin {
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:white;
  color:#222;
  font-weight:bold;
}

#chatScreen {
  flex:1;
  display:none;
  flex-direction:column;
  min-height:0;
}

#welcome {
  margin:auto;
  text-align:center;
  padding:25px;
}

#welcome h1 {
  font-size:clamp(27px,5vw,42px);
  margin-bottom:10px;
}

#welcome p {
  color:var(--muted);
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:24px max(18px,calc((100% - 850px)/2));
  display:flex;
  flex-direction:column;
  gap:18px;
}

.message {
  max-width:850px;
  width:100%;
  padding:15px 17px;
  border-radius:14px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.user {
  align-self:flex-end;
  background:#30234f;
  max-width:min(85%,700px);
}

.message.ai {
  align-self:flex-start;
  background:var(--panel);
  border:1px solid var(--border);
}

#composer {
  width:min(850px,calc(100% - 30px));
  margin:0 auto 18px;
  display:flex;
  gap:10px;
  padding:10px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
}

#prompt {
  flex:1;
  min-width:0;
  resize:none;
  border:0;
  outline:0;
  color:var(--text);
  background:transparent;
  padding:10px;
  max-height:150px;
}

#sendButton {
  width:45px;
  height:45px;
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:white;
  font-size:20px;
}

#sendButton:disabled {
  opacity:.5;
  cursor:not-allowed;
}

#logoutButton {
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px 12px;
}

#notice {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:0 10px 12px;
}

@media(max-width:650px) {
  #sidebar {
    width:75px;
    padding:10px 7px;
  }

  .logo {
    font-size:11px;
    text-align:center;
    padding:8px 0;
    overflow:hidden;
  }

  #newChat {
    font-size:0;
    padding:13px 4px;
  }

  #newChat::after {
    content:"+";
    font-size:22px;
  }

  .chat-item {
    font-size:0;
    height:40px;
    padding:5px;
  }

  .chat-item::before {
    content:"◉";
    font-size:17px;
  }

  #topbar {
    padding:0 12px;
  }

  #messages {
    padding:15px 12px;
  }
}
</style>
</head>

<body>
<div id="app">

  <aside id="sidebar">
    <div class="logo">DAVENTRA <span>AI</span></div>

    <button id="newChat">+ Новый чат</button>

    <div id="chatList"></div>
  </aside>

  <main id="main">

    <header id="topbar">
      <strong>DAVENTRA AI</strong>
      <div style="display:flex;align-items:center;gap:12px">
        <span id="topStatus">Не авторизован</span>
        <button id="logoutButton" style="display:none">Выйти</button>
      </div>
    </header>

    <section id="loginScreen">
      <h2>Добро пожаловать</h2>
      <p style="color:var(--muted)">Войди, чтобы пользоваться DAVENTRA AI</p>
      <button id="googleLogin">Войти через Google</button>
      <p id="loginError" style="color:var(--danger)"></p>
    </section>

    <section id="chatScreen">
      <div id="welcome">
        <h1>Чем могу помочь?</h1>
        <p>DAVENTRA AI — интеллектуальный помощник</p>
      </div>

      <div id="messages"></div>

      <div id="composer">
        <textarea id="prompt"
          rows="1"
          placeholder="Напиши сообщение..."></textarea>
        <button id="sendButton">➤</button>
      </div>

      <div id="notice">
        Ответы генерируются Gemini через Firebase AI Logic.
      </div>
    </section>

  </main>
</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
  initializeAppCheck,
  ReCaptchaEnterpriseProvider,
  getToken
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app-check.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  addDoc,
  getDocs,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

import {
  getAI,
  getGenerativeModel,
  GoogleAIBackend
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-ai.js";


const firebaseConfig = {
  apiKey: "AIzaSyCA8ONpSRkIsXotSYL_qJIxE-18VzqTcBQ",
  authDomain: "daventra-ai.firebaseapp.com",
  projectId: "daventra-ai",
  storageBucket: "daventra-ai.firebasestorage.app",
  messagingSenderId: "978786636501",
  appId: "1:978786636501:web:28a6899e612c9c07ec885c"
};

const app = initializeApp(firebaseConfig);


// APP CHECK

const appCheck = initializeAppCheck(app, {
  provider: new ReCaptchaEnterpriseProvider(
    "6LczoBwuAAAAABbs_ATjwycpXTS_0dXg8AeIqKbJ"
  ),
  isTokenAutoRefreshEnabled: true
});


// Проверяем получение App Check токена

getToken(appCheck, true)
  .then(result => {
    console.log("APP CHECK TOKEN RECEIVED");
    console.log("Token length:", result.token.length);
  })
  .catch(error => {
    console.error("APP CHECK ERROR:", error);
  });


// AUTHENTICATION

const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

try {
  await setPersistence(auth, browserLocalPersistence);
} catch(error) {
  console.error("Persistence error:", error);
}


// FIRESTORE

const db = getFirestore(app);


// GEMINI

const ai = getAI(app, {
  backend: new GoogleAIBackend()
});

const model = getGenerativeModel(ai, {
  model: "gemini-3.8-flash",
  systemInstruction:
    "Ты DAVENTRA AI — интеллектуальный помощник. " +
    "Отвечай на языке пользователя, понятно, точно и дружелюбно. " +
    "Не выдумывай факты, если не знаешь ответа."
});


// APP STATE

let currentUser = null;
let currentChatId = null;
let unsubscribeMessages = null;
let unsubscribeChats = null;

const $ = id => document.getElementById(id);


// FIRESTORE PATHS

function chatsRef() {
  return collection(db, "users", currentUser.uid, "chats");
}

function chatRef(chatId) {
  return doc(db, "users", currentUser.uid, "chats", chatId);
}

function messagesRef(chatId) {
  return collection(
    db,
    "users",
    currentUser.uid,
    "chats",
    chatId,
    "messages"
  );
}
// GOOGLE LOGIN

$("googleLogin").addEventListener("click", async () => {
  $("loginError").textContent = "";

  try {
    await signInWithPopup(auth, googleProvider);
  } catch(error) {
    console.error("Google login error:", error);
    $("loginError").textContent = error.message;
  }
});


// LOGOUT

$("logoutButton").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch(error) {
    console.error("Logout error:", error);
  }
});


// AUTH STATE

onAuthStateChanged(auth, user => {
  currentUser = user;

  if (unsubscribeChats) {
    unsubscribeChats();
    unsubscribeChats = null;
  }

  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  if (user) {
    $("loginScreen").style.display = "none";
    $("chatScreen").style.display = "flex";
    $("logoutButton").style.display = "block";
    $("topStatus").textContent = user.email || "В сети";

    loadChats();
  } else {
    currentChatId = null;
    $("loginScreen").style.display = "block";
    $("chatScreen").style.display = "none";
    $("logoutButton").style.display = "none";
    $("topStatus").textContent = "Не авторизован";
    $("chatList").innerHTML = "";
    $("messages").innerHTML = "";
  }
});


// LOAD CHAT LIST

function loadChats() {
  const q = query(
    chatsRef(),
    orderBy("updatedAt", "desc")
  );

  unsubscribeChats = onSnapshot(q, snapshot => {
    $("chatList").innerHTML = "";

    snapshot.forEach(chatDoc => {
      const data = chatDoc.data();

      const button = document.createElement("button");
      button.className = "chat-item";
      button.textContent = data.title || "Новый чат";

      if (chatDoc.id === currentChatId) {
        button.classList.add("active");
      }

      button.addEventListener("click", () => {
        openChat(chatDoc.id);
      });

      $("chatList").appendChild(button);
    });
  }, error => {
    console.error("Chat list error:", error);
    $("topStatus").textContent = "Ошибка загрузки чатов";
  });
}


// CREATE CHAT

async function createChat(firstMessage = "") {
  const title = firstMessage
    ? firstMessage.slice(0, 40)
    : "Новый чат";

  const chat = await addDoc(chatsRef(), {
    title,
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  });

  return chat.id;
}


// OPEN CHAT

function openChat(chatId) {
  currentChatId = chatId;

  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  $("welcome").style.display = "none";
  $("messages").innerHTML = "";

  const q = query(
    messagesRef(chatId),
    orderBy("createdAt", "asc")
  );

  unsubscribeMessages = onSnapshot(q, snapshot => {
    $("messages").innerHTML = "";

    snapshot.forEach(messageDoc => {
      const data = messageDoc.data();

      const message = document.createElement("div");
      message.className =
        "message " +
        (data.role === "user" ? "user" : "ai");

      message.textContent = data.text || "";

      $("messages").appendChild(message);
    });

    $("messages").scrollTop =
      $("messages").scrollHeight;
  }, error => {
    console.error("Messages error:", error);
    $("topStatus").textContent = "Ошибка загрузки сообщений";
  });
}


// NEW CHAT BUTTON

$("newChat").addEventListener("click", async () => {
  if (!currentUser) return;

  try {
    const chatId = await createChat();
    openChat(chatId);
  } catch(error) {
    console.error("Create chat error:", error);
    $("topStatus").textContent = "Не удалось создать чат";
  }
});
// SEND MESSAGE

async function sendMessage() {
  if (!currentUser) return;

  const prompt = $("prompt").value.trim();

  if (!prompt) return;

  $("prompt").value = "";
  $("sendButton").disabled = true;
  $("topStatus").textContent = "Gemini думает...";

  try {
    if (!currentChatId) {
      currentChatId = await createChat(prompt);
      openChat(currentChatId);
    }

    const chatId = currentChatId;

    // Save user message

    await addDoc(messagesRef(chatId), {
      role: "user",
      text: prompt,
      createdAt: serverTimestamp()
    });

    // Load conversation history

    const historyQuery = query(
      messagesRef(chatId),
      orderBy("createdAt", "asc")
    );

    const historySnapshot = await getDocs(historyQuery);

    const history = [];

    historySnapshot.forEach(messageDoc => {
      const data = messageDoc.data();

      if (!data.text) return;

      history.push({
        role: data.role === "user" ? "user" : "model",
        parts: [{ text: data.text }]
      });
    });

    // Remove the current prompt from history.
    // It will be sent separately below.

    history.pop();

    // Ask Gemini

    const chat = model.startChat({
      history: history
    });

    const result = await chat.sendMessage(prompt);
    const answer = result.response.text();

    // Save Gemini response

    await addDoc(messagesRef(chatId), {
      role: "model",
      text: answer,
      createdAt: serverTimestamp()
    });

    $("topStatus").textContent = "Готов";

  } catch(error) {
    console.error("DAVENTRA AI ERROR:", error);

    let message = "Не удалось получить ответ: ";

    if (error.code === "permission-denied") {
      message += "Ошибка доступа Firestore.";
    } else if (
      error.message &&
      error.message.toLowerCase().includes("app check")
    ) {
      message += "Ошибка App Check. Проверь reCAPTCHA Enterprise.";
    } else if (
      error.message &&
      error.message.toLowerCase().includes("quota")
    ) {
      message += "Превышен лимит запросов Gemini.";
    } else {
      message += error.message || "Неизвестная ошибка.";
    }

    const errorElement = document.createElement("div");
    errorElement.className = "message ai";
    errorElement.textContent = message;

    $("messages").appendChild(errorElement);
    $("messages").scrollTop = $("messages").scrollHeight;

    $("prompt").value = prompt;
    $("topStatus").textContent = "Ошибка";
  } finally {
    $("sendButton").disabled = false;
    $("prompt").focus();
  }
}


// SEND BUTTON

$("sendButton").addEventListener("click", sendMessage);


// ENTER TO SEND

$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});


// END

</script>
</body>
</html>
