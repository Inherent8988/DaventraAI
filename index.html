
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAVENTRA AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0b0d14;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  background: #151824;
  border: 1px solid #292e40;
  border-radius: 20px;
  padding: 32px 24px;
  text-align: center;
}

.logo {
  font-size: 32px;
  font-weight: 800;
  color: #a78bfa;
  margin-bottom: 12px;
}

.description {
  color: #a4a9bb;
  line-height: 1.5;
  margin-bottom: 28px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#googleLogin {
  background: #fff;
  color: #222;
}

#googleLogin:disabled {
  opacity: .5;
  cursor: wait;
}

#logout {
  background: #292e40;
  color: white;
  margin-top: 20px;
}

#status {
  color: #b8a5ff;
  font-size: 13px;
  margin-top: 20px;
  overflow-wrap: anywhere;
}

#account {
  display: none;
}

.avatar {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  margin: 12px auto;
  object-fit: cover;
  background: #292e40;
}

.email {
  color: #b8a5ff;
  overflow-wrap: anywhere;
  margin-top: 10px;
}

</style>
</head>

<body>

<div class="container">

  <div class="logo">DAVENTRA AI</div>

  <div id="login">
    <h2>Добро пожаловать!</h2>

    <p class="description">
      Войдите или зарегистрируйтесь,
      используя свой Google-аккаунт.
    </p>

    <button id="googleLogin">
      Продолжить с Google
    </button>
  </div>

  <div id="account">
    <h2>Вы вошли в аккаунт!</h2>

    <img id="avatar" class="avatar" alt="Аватар">

    <h3 id="userName"></h3>
    <div id="userEmail" class="email"></div>

    <button id="logout">Выйти из аккаунта</button>
  </div>

  <div id="status">Подключение к Firebase...</div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCA8ONpSRkIsXotSYL_qJIxE-18VzqTcBQ",
  authDomain: "daventra-ai.firebaseapp.com",
  projectId: "daventra-ai",
  storageBucket: "daventra-ai.firebasestorage.app",
  messagingSenderId: "978786636501",
  appId: "1:978786636501:web:28a6899e612c9c07ec885c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({
  prompt: "select_account"
});

const login = document.getElementById("login");
const account = document.getElementById("account");
const status = document.getElementById("status");
const googleButton = document.getElementById("googleLogin");

googleButton.addEventListener("click", async () => {

  googleButton.disabled = true;
  status.textContent = "Открываем Google...";

  try {

    await setPersistence(
      auth,
      browserLocalPersistence
    );

    const result = await signInWithPopup(
      auth,
      provider
    );

    if (result.user) {
      status.textContent = "Регистрация прошла успешно!";
    }

  } catch (error) {

    console.error(error);

    status.textContent =
      "Ошибка: " + error.code + " — " + error.message;

  } finally {

    googleButton.disabled = false;

  }

});

onAuthStateChanged(auth, user => {

  if (user) {

    login.style.display = "none";
    account.style.display = "block";

    document.getElementById("userName").textContent =
      user.displayName || "Пользователь";

    document.getElementById("userEmail").textContent =
      user.email || "";

    const avatar = document.getElementById("avatar");

    if (user.photoURL) {
      avatar.src = user.photoURL;
      avatar.style.display = "block";
    } else {
      avatar.style.display = "none";
    }

    status.textContent = "Аккаунт успешно подключён.";

  } else {

    login.style.display = "block";
    account.style.display = "none";

    status.textContent = "Войдите через Google.";

  }

}, error => {

  status.textContent =
    "Ошибка проверки авторизации: " + error.message;

});

document.getElementById("logout").addEventListener(
  "click",
  async () => {

    try {
      await signOut(auth);
      status.textContent = "Вы вышли из аккаунта.";
    } catch (error) {
      status.textContent = "Ошибка выхода: " + error.message;
    }

  }
);

</script>

</body>
</html>
